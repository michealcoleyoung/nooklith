<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Nooklith — your little corner of the internet.">
  <title>{% block title %}Nooklith · Your little corner of the internet{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="header">
    <a class="brand" href="{{ url_for('main.index') }}"><span class="brand-icon" aria-hidden="true">▱</span> nooklith<span class="brand-dot">.</span></a>
    <button class="add-button" disabled title="Bookmark creation arrives in Phase 2">+ Add Bookmark <span class="soon">Soon</span></button>
  </header>
  {% block content %}{% endblock %}
</body>
</html>
