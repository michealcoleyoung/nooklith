[project]
name = "nooklith"
version = "0.1.0"
description = "Your little corner of the internet — a local personal bookmark manager."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["browser: optional real browser tests using an isolated local server"]

[dependency-groups]
dev = [
    "playwright>=1.65.1",
    "pytest>=9.2.0",
]
